<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradutor de Voz para LIBRAS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f0f2f5; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .container { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); text-align: center; max-width: 480px; width: 100%; }
    h1 { font-size: 1.4rem; margin-bottom: 20px; color: #1a73e8; }
    
    .botoes-wrapper { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .btn-mic { background-color: #1a73e8; color: white; border: none; padding: 16px; font-size: 1.1rem; font-weight: 600; border-radius: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3); }
    .btn-mic.gravando { background-color: #ea4335; }
    
    .btn-popup { background-color: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; padding: 10px; font-size: 0.9rem; font-weight: 600; border-radius: 20px; cursor: pointer; }

    /* Caixa de Texto que sempre aparece */
    .status-box { padding: 15px; background-color: #e8f0fe; border-radius: 8px; border: 1px solid #d2e3fc; min-height: 80px; display: flex; align-items: center; justify-content: center; margin-top: 15px; }
    .status-text { font-size: 1.1rem; color: #1a73e8; font-weight: 600; word-break: break-word; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tradutor para LIBRAS</h1>
    
    <div class="botoes-wrapper">
      <button id="btnFalar" class="btn-mic"><span>🎤</span> Falar no Microfone</button>
      <button id="btnPopup" class="btn-popup"><span>🔲</span> Abrir em Janela Flutuante</button>
    </div>

    <!-- Caixa de texto de volta aqui -->
    <div class="status-box">
      <p id="texto" class="status-text">Clique no botão e comece a falar...</p>
    </div>
  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    window.addEventListener('load', () => {
      setTimeout(() => {
        const botaoMaozinha = document.querySelector('[vw-access-button]');
        if (botaoMaozinha) botaoMaozinha.click();
      }, 1000);
      
      if (window.name === 'JanelaLIBRAS' || window.opener) {
        document.getElementById('btnPopup').style.display = 'none';
      }
    });

    document.getElementById('btnPopup').addEventListener('click', () => {
      window.open(window.location.href, 'JanelaLIBRAS', 'width=450,height=680,resizable=yes');
    });

    const btnFalar = document.getElementById('btnFalar');
    const campoTexto = document.getElementById('texto');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';

      btnFalar.addEventListener('click', () => {
        try { recognition.start(); } catch (e) { recognition.stop(); }
      });

      recognition.onstart = () => {
        btnFalar.classList.add('gravando');
        btnFalar.innerHTML = '<span>🔴</span> Ouvindo...';
        campoTexto.innerText = "Pode falar...";
      };

      recognition.onresult = (event) => {
        const textoFalado = event.results[0][0].transcript;
        campoTexto.innerText = textoFalado; // Exibe o texto aqui

        setTimeout(() => {
          const ev = new MouseEvent('click', { bubbles: true });
          campoTexto.dispatchEvent(ev);
        }, 400);
      };

      recognition.onend = () => {
        btnFalar.classList.remove('gravando');
        btnFalar.innerHTML = '<span>🎤</span> Falar no Microfone';
      };
    }
  </script>
</body>
</html>
