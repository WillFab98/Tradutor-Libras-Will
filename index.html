<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tradutor LIBRAS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    
    body { 
      background-color: #f8f9fa; 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px;
      padding-top: 220px;
    }
    
    .container { 
      background: #ffffff; 
      padding: 20px; 
      border-radius: 20px; 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
      width: 100%; 
      max-width: 400px;
    }
    
    .botoes-wrapper { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    
    input[type="text"] { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 15px; font-size: 1rem; }

    .btn-traduzir { background-color: #34a853; color: white; border: none; padding: 15px; font-weight: bold; border-radius: 15px; cursor: pointer; width: 100%; }
    .btn-mic { background-color: #1a73e8; color: white; border: none; padding: 15px; font-weight: bold; border-radius: 15px; cursor: pointer; width: 100%; }
    .btn-popup { background-color: #f1f3f4; color: #5f6368; border: none; padding: 12px; font-size: 0.9rem; border-radius: 15px; cursor: pointer; width: 100%; }
    
    .status-box { padding: 15px; background-color: #e8f0fe; border-radius: 15px; margin-top: 15px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    .status-text { font-size: 1rem; color: #1a73e8; font-weight: 600; word-break: break-word; }

    /* Fixa o avatar no topo */
    div[vw] { position: fixed !important; top: 10px !important; left: 50% !important; transform: translateX(-50%) !important; z-index: 9999 !important; }
  </style>
</head>
<body>

  <div class="container">
    <input type="text" id="campoManual" placeholder="Digite algo para traduzir...">
    
    <div class="botoes-wrapper">
      <button id="btnTraduzirManual" class="btn-traduzir">Traduzir Texto</button>
      <button id="btnFalar" class="btn-mic"><span>🎤</span> Falar agora</button>
      <button id="btnPopup" class="btn-popup">🔲 Abrir em Janela Flutuante</button>
    </div>

    <div class="status-box">
      <p id="texto" class="status-text">Aguardando...</p>
    </div>
  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper></div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    // 1. Abre o avatar sozinho
    window.addEventListener('load', () => {
      setTimeout(() => {
        const botaoMaozinha = document.querySelector('[vw-access-button]');
        if (botaoMaozinha) botaoMaozinha.click();
      }, 1500); // 1.5 segundos para garantir que carregou
      
      // Esconde o botão de janela se já estiver em um popup
      if (window.name === 'JanelaLIBRAS' || window.opener) {
        document.getElementById('btnPopup').style.display = 'none';
      }
    });

    // 2. Lógica do botão de janela flutuante
    document.getElementById('btnPopup').addEventListener('click', () => {
      window.open(window.location.href, 'JanelaLIBRAS', 'width=450,height=680,resizable=yes');
    });

    const campoTexto = document.getElementById('texto');
    const campoManual = document.getElementById('campoManual');

    function atualizarTraducao(frase) {
        campoTexto.innerText = frase;
        setTimeout(() => {
            const ev = new MouseEvent('click', { bubbles: true });
            campoTexto.dispatchEvent(ev);
        }, 300);
    }

    document.getElementById('btnTraduzirManual').addEventListener('click', () => {
        if (campoManual.value.trim() !== "") atualizarTraducao(campoManual.value);
    });

    const btnFalar = document.getElementById('btnFalar');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      btnFalar.addEventListener('click', () => recognition.start());
      recognition.onresult = (event) => atualizarTraducao(event.results[0][0].transcript);
    }
  </script>
</body>
</html>
